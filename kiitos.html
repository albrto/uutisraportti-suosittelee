<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiitos palautteesta! – Uutisraportti</title>
  <meta name="theme-color" content="#11141b">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="preload" href="fonts/spline-sans-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="receipt-page">
    <div class="receipt">
      <h1>Kiitos palautteesta!</h1>
      <p>Viestisi on lähetetty onnistuneesti. Tiedot pysyvät kunnossa juuri tällaisten viestien ansiosta.</p>
      <a href="/" class="submit-btn">Palaa suositusten pariin</a>
    </div>
  </main>
  <!-- Kävijämittaus (GoatCounter): evästeetön, vain tuotantodomainilla,
       jotta dev-kokeiluversio ja paikallinen selailu eivät kirjaudu tilastoihin -->
  <script>
    if (location.hostname === 'uutisrapsa.fi' || location.hostname === 'www.uutisrapsa.fi') {
      var gc = document.createElement('script');
      gc.async = true;
      gc.src = 'https://gc.zgo.at/count.js';
      gc.dataset.goatcounter = 'https://uutisrapsa.goatcounter.com/count';
      document.body.appendChild(gc);
    }
  </script>
</body>
</html>
